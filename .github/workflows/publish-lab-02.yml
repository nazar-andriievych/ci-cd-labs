# Lab 2 — test, build, publish.
#
# Based on catshop-examples/pipeline/08-publish. A red suite cannot publish,
# because the image job `needs` the test job. A pull request builds and stops;
# a push publishes the image to GHCR, tagged with the commit it was built from.
name: publish-lab-02

on:
  pull_request:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  push:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]

# start from nothing and add the one scope that is needed. Without packages: write
# the push answers 403 - the token is real, it was minted for this run, it simply
# was never given the permission to write packages.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: lab-02
      - run: python -m pytest tests -q
        working-directory: lab-02

  image:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      # the digest leaves the job as a string: the one name that cannot be moved
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # one place decides whether this run publishes: a push does, a pull request does not
      - id: meta
        run: |
          # GHCR rejects an uppercase path, and an owner may have capitals
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN is minted for this run and dies with it - nobody has to rotate it
      - if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: ${{ steps.meta.outputs.publish }}     # a pull request builds and stops
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # ties these bytes to the commit they were built from
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - if: steps.meta.outputs.publish == 'true'
        run: echo "published ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
